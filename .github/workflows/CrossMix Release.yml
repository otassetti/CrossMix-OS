name: Smart Pro test release

on:
  push:
    branches: [release/smart-pro-main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Numeric personal package version (X.Y.Z)'
        required: true
        default: '1.3.4'
        type: string

permissions:
  contents: write

concurrency:
  group: smart-pro-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'otassetti/CrossMix-OS'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_VERSION: ${{ inputs.version || '1.3.4' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y 7zip zip unzip rsync
      - name: Check shell syntax and migration behavior
        run: |
          bash -n scripts/build-smart-pro-release.sh
          bash -n System/usr/trimui/scripts/crossmix_update.sh
          bash -n System/starts/_FirmwareCheck.sh
          python3 tests/test_release_migration.py
      - name: Prepare and verify SD card package
        run: bash scripts/build-smart-pro-release.sh "$BUILD_VERSION"
      - name: Create draft prerelease
        run: |
          gh release create "v$BUILD_VERSION" dist/* \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "CrossMix Smart Pro v$BUILD_VERSION — personal test build" \
            --notes-file docs/smart-pro-release.md
